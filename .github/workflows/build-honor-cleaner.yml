name: Build Honor Cleaner APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'honor-cleaner/**'
      - '.github/workflows/build-honor-cleaner.yml'
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: honor-cleaner
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HonorCleaner-debug-apk
          path: honor-cleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
